<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S19 波普艺术 Pop Art</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#ffe600;--pink:#ff2d95;--cyan:#00d9ff;--red:#ff3d3d;--ink:#000}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--yellow);color:var(--ink);font-family:'Space Grotesk',sans-serif;line-height:1.5;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(var(--pink) 1.5px,transparent 1.5px);background-size:26px 26px;opacity:.35;pointer-events:none;z-index:0}
.nav{position:relative;z-index:1;background:var(--ink);border-bottom:6px solid var(--pink)}
.nav-in{max-width:1150px;margin:0 auto;padding:18px 40px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Bungee',cursive;font-size:24px;color:var(--yellow);letter-spacing:.02em}
.links{display:flex;gap:18px}
.links a{font-family:'Bungee',cursive;font-size:14px;color:var(--ink);text-decoration:none;background:var(--cyan);padding:8px 16px;border:3px solid var(--yellow);transition:.15s}
.links a:nth-child(2){background:var(--pink);color:#fff}
.links a:nth-child(3){background:var(--yellow)}
.links a:hover{transform:rotate(-3deg) scale(1.08)}
.wrap{max-width:1150px;margin:0 auto;padding:0 40px;position:relative;z-index:1}
.hero{padding:80px 0 60px}
.eyebrow{display:inline-block;font-family:'Bungee',cursive;font-size:15px;background:var(--ink);color:var(--yellow);padding:8px 18px;margin-bottom:22px;transform:rotate(-2deg)}
h1{font-family:'Archivo Black',sans-serif;font-size:clamp(44px,7.5vw,88px);line-height:.95;color:var(--ink);text-shadow:5px 5px 0 var(--pink);letter-spacing:-.02em}
h1 em{color:var(--red);font-style:normal;text-shadow:5px 5px 0 var(--cyan)}
.sub{margin-top:26px;font-size:18px;font-weight:700;max-width:50ch;background:#fff;display:inline-block;padding:10px 18px;border:4px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:32px;padding-bottom:90px}
.card{background:#fff;border:5px solid var(--ink);box-shadow:10px 10px 0 var(--pink);text-decoration:none;color:var(--ink);transition:.15s;display:block}
.card:nth-child(2){box-shadow:10px 10px 0 var(--cyan)}
.card:nth-child(3){box-shadow:10px 10px 0 var(--red)}
.card:hover{transform:translate(4px,4px);box-shadow:5px 5px 0 var(--ink)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-bottom:5px solid var(--ink);filter:saturate(1.6) contrast(1.2)}
.cbody{padding:20px 22px 24px}
.ctitle{font-family:'Archivo Black',sans-serif;font-size:24px;line-height:1.05;margin-bottom:8px}
.csub{font-size:15px;font-weight:500}
.tags{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-family:'Bungee',cursive;font-size:11px;background:var(--yellow);border:2px solid var(--ink);padding:3px 10px}
.tag:nth-child(2){background:var(--cyan)}
footer{background:var(--ink);color:var(--yellow);padding:28px 40px;max-width:1150px;margin:0 auto;display:flex;justify-content:space-between;font-family:'Bungee',cursive;font-size:13px;position:relative;z-index:1}
</style>
</head>
<body>
<div class="nav"><div class="nav-in"><div class="brand">★ PORTFOLIO ★</div><div class="links"><a href="#">作品</a><a href="#">关于</a><a href="#">联系</a></div></div></div>
<div class="wrap hero"><div class="eyebrow">POP! SELECTED WORKS</div><h1>界面设计<br>与<em>前端</em>实现</h1><p class="sub">从真实需求出发，追求克制的视觉与扎实的交互。</p></div>
<div class="wrap"><div class="grid">
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">界面重构计划</div><div class="csub">企业级后台视觉与交互重构</div><div class="tags"><span class="tag">VUE</span><span class="tag">DS</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">数据看板系统</div><div class="csub">面向运维的实时监控面板</div><div class="tags"><span class="tag">BOOT</span><span class="tag">ECHARTS</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">内容平台</div><div class="csub">创作者内容发布与展示</div><div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span></div></div></a>
</div></div>
<footer><span>© 2026 PORTFOLIO</span><span>★ POP ART ★</span></footer>
<script src="/styles-preview/switcher.js"></script>
</body>
</html>
