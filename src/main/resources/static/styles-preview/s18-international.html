<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S18 瑞士国际主义 International Typographic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#000;--gray:#666;--line:#ddd;--accent:#111}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.nav{border-bottom:1px solid var(--line)}
.nav-in{max-width:1280px;margin:0 auto;padding:26px 48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
.links{display:flex;gap:32px;font-size:13px;color:var(--gray)}
.links a{color:inherit;text-decoration:none}.links a:hover{color:var(--ink)}
.nav-meta{text-align:right;font-size:11px;color:var(--gray);font-family:monospace;letter-spacing:.05em}
.wrap{max-width:1280px;margin:0 auto;padding:0 48px}
.hero{padding:110px 0 70px;display:grid;grid-template-columns:1.6fr 1fr;gap:60px;align-items:end}
h1{font-size:clamp(48px,8vw,110px);font-weight:300;line-height:.92;letter-spacing:-.05em}
h1 b{font-weight:700}
.sub{font-size:15px;color:var(--gray);line-height:1.7;padding-bottom:14px;border-top:1px solid var(--ink);padding-top:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--ink)}
.card{text-decoration:none;color:var(--ink);display:block;padding:0 32px 40px;border-right:1px solid var(--line);transition:.25s}
.card:first-child{padding-left:0}
.card:last-child{border-right:none;padding-right:0}
.card:hover{background:#fafafa}
.num{font-family:monospace;font-size:12px;color:var(--gray);padding:24px 0 20px}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;filter:grayscale(1);transition:.4s}
.card:hover img{filter:grayscale(0)}
.ctitle{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:18px 0 8px}
.csub{font-size:13.5px;color:var(--gray);line-height:1.6}
.tags{margin-top:14px;font-size:11px;color:var(--ink);font-family:monospace;letter-spacing:.04em}
.tag{margin-right:12px}
footer{border-top:1px solid var(--ink);padding:26px 48px;max-width:1280px;margin:70px auto 0;display:flex;justify-content:space-between;font-size:11px;color:var(--gray);font-family:monospace;letter-spacing:.05em}
</style>
</head>
<body>
<div class="nav"><div class="nav-in"><div class="brand">Portfolio</div><div class="links"><a href="#">作品</a><a href="#">关于</a><a href="#">联系</a></div><div class="nav-meta">SELECTED WORKS / 2026</div></div></div>
<div class="wrap hero"><div><h1>界面设计<br><b>与前端实现</b></h1></div><p class="sub">从真实需求出发，追求克制的视觉<br>与扎实的交互。</p></div>
<div class="wrap"><div class="grid">
<a class="card" href="#"><div class="num">01</div><img src="/img/1.jpg" alt=""><div class="ctitle">界面重构计划</div><div class="csub">企业级后台视觉与交互重构</div><div class="tags"><span class="tag">Vue</span><span class="tag">Design System</span></div></a>
<a class="card" href="#"><div class="num">02</div><img src="/img/1.jpg" alt=""><div class="ctitle">数据看板系统</div><div class="csub">面向运维的实时监控面板</div><div class="tags"><span class="tag">Spring Boot</span><span class="tag">ECharts</span></div></a>
<a class="card" href="#"><div class="num">03</div><img src="/img/1.jpg" alt=""><div class="ctitle">内容平台</div><div class="csub">创作者内容发布与展示</div><div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span></div></a>
</div></div>
<footer><span>© 2026 PORTFOLIO</span><span>INTERNATIONAL TYPOGRAPHIC STYLE</span></footer>
<script src="/styles-preview/switcher.js"></script>
</body>
</html>
