<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S08 包豪斯 Bauhaus</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d62828;--blue:#003049;--yellow:#fcbf49;--bg:#f5f1e8;--ink:#111}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;line-height:1.5}
.nav{border-bottom:6px solid var(--ink);display:grid;grid-template-columns:auto 1fr auto;align-items:stretch}
.nav-logo{background:var(--red);padding:20px 32px;font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em}
.nav-mid{border-left:6px solid var(--ink);border-right:6px solid var(--ink)}
.links{display:flex;gap:0;height:100%}
.links a{color:var(--ink);text-decoration:none;padding:20px 28px;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;border-right:2px solid var(--ink);transition:.2s}
.links a:hover{background:var(--yellow)}
.nav-cta{background:var(--blue);color:#fff;padding:20px 32px;font-weight:600;text-transform:uppercase;font-size:14px;letter-spacing:.08em}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.hero{padding:80px 0 60px;display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:start}
.hero-mark{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:120px;padding-top:10px}
.hero-mark i{aspect-ratio:1;display:block}
.hero-mark i:nth-child(1){background:var(--red);border-radius:50%}
.hero-mark i:nth-child(2){background:var(--blue)}
.hero-mark i:nth-child(3){background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hero-mark i:nth-child(4){background:var(--ink)}
h1{font-size:clamp(42px,7vw,78px);font-weight:800;line-height:.98;letter-spacing:-.03em;text-transform:uppercase}
.sub{margin-top:22px;font-size:18px;max-width:52ch;border-left:6px solid var(--red);padding-left:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:6px solid var(--ink);padding-bottom:0}
.card{text-decoration:none;color:var(--ink);border-right:6px solid var(--ink);border-bottom:6px solid var(--ink);padding:0;transition:.25s;display:block;background:#fff}
.card:nth-child(3){border-right:none}
.card:hover{background:var(--yellow)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-bottom:6px solid var(--ink);filter:contrast(1.1) saturate(1.2)}
.cbody{padding:24px}
.ctitle{font-size:22px;font-weight:800;text-transform:uppercase;margin-bottom:6px;letter-spacing:-.01em}
.csub{font-size:14px}
.tags{margin-top:14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--red)}
footer{border-top:6px solid var(--ink);padding:28px 40px;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
</style>
</head>
<body>
<div class="nav"><div class="nav-logo">BAUHAUS</div><div class="nav-mid"><div class="links"><a href="#">作品</a><a href="#">关于</a><a href="#">联系</a></div></div><div class="nav-cta">MENU</div></div>
<div class="wrap hero"><div class="hero-mark"><i></i><i></i><i></i><i></i></div><div><h1>界面设计<br>与前端实现</h1><p class="sub">从真实需求出发，追求克制的视觉与扎实的交互。</p></div></div>
<div class="wrap"><div class="grid">
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">界面重构计划</div><div class="csub">企业级后台视觉与交互重构</div><div class="tags">VUE / DESIGN SYSTEM</div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">数据看板系统</div><div class="csub">面向运维的实时监控面板</div><div class="tags">SPRING BOOT / ECHARTS</div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">内容平台</div><div class="csub">创作者内容发布与展示</div><div class="tags">HTML / CSS</div></div></a>
</div></div>
<footer><span>© 2026 PORTFOLIO</span><span>BAUHAUS 1919</span></footer>
<script src="/styles-preview/switcher.js"></script>
</body>
</html>
