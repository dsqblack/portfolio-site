<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S05 玻璃拟态 Glassmorphism</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Outfit',sans-serif;color:#fff;line-height:1.6;
background:linear-gradient(135deg,#667eea,#764ba2 40%,#f093fb 70%,#4facfe);background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 50%),radial-gradient(circle at 70% 80%,rgba(255,255,255,.2),transparent 50%);pointer-events:none}
.nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.25)}
.nav-in{max-width:1200px;margin:0 auto;padding:18px 40px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:700}
.links{display:flex;gap:28px;font-size:15px}
.links a{color:#fff;text-decoration:none;opacity:.85}.links a:hover{opacity:1}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.hero{padding:90px 0 70px}
.eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;margin-bottom:16px}
h1{font-size:clamp(40px,6vw,70px);font-weight:700;line-height:1.08;letter-spacing:-.02em}
.sub{margin-top:22px;font-size:18px;opacity:.9;max-width:54ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:28px;padding-bottom:90px}
.card{background:rgba(255,255,255,.15);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.3);border-radius:20px;overflow:hidden;text-decoration:none;color:#fff;transition:.3s;display:block}
.card:hover{transform:translateY(-6px);background:rgba(255,255,255,.22);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.cbody{padding:22px 24px 26px}
.ctitle{font-size:22px;font-weight:700;margin-bottom:8px}
.csub{font-size:15px;opacity:.85}
.tags{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tag{font-size:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:3px 10px;border-radius:20px}
footer{padding:36px 40px;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;font-size:13px;opacity:.8}
</style>
</head>
<body>
<nav class="nav"><div class="nav-in"><div class="brand">作品集</div><div class="links"><a href="#">作品</a><a href="#">关于</a><a href="#">联系</a></div></div></nav>
<div class="wrap hero"><div class="eyebrow">Selected Works</div><h1>界面设计与前端实现</h1><p class="sub">从真实需求出发，追求克制的视觉与扎实的交互。</p></div>
<div class="wrap"><div class="grid">
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">界面重构计划</div><div class="csub">企业级后台视觉与交互重构</div><div class="tags"><span class="tag">Vue</span><span class="tag">Design System</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">数据看板系统</div><div class="csub">面向运维的实时监控面板</div><div class="tags"><span class="tag">Spring Boot</span><span class="tag">ECharts</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">内容平台</div><div class="csub">创作者内容发布与展示</div><div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span></div></div></a>
</div></div>
<footer><span>© 2026 Portfolio</span><span>Glass Style</span></footer>
<script src="/styles-preview/switcher.js"></script>
</body>
</html>
