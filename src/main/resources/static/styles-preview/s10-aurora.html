<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S10 极光渐变 Aurora</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b14;color:#fff;font-family:'Sora',sans-serif;line-height:1.6;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;top:-30%;left:-20%;width:80%;height:80%;background:radial-gradient(circle,rgba(0,255,180,.25),transparent 65%);filter:blur(70px);pointer-events:none;animation:float 12s ease-in-out infinite}
body::after{content:'';position:fixed;bottom:-30%;right:-20%;width:80%;height:80%;background:radial-gradient(circle,rgba(120,80,255,.3),transparent 65%);filter:blur(70px);pointer-events:none;animation:float 15s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-40px)}}
.nav{position:sticky;top:0;z-index:10;background:rgba(11,11,20,.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.1)}
.nav-in{max-width:1200px;margin:0 auto;padding:18px 40px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:700;background:linear-gradient(90deg,#00ffb4,#7850ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:28px;font-size:15px}
.links a{color:#c0c0d0;text-decoration:none}.links a:hover{color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px;position:relative;z-index:1}
.hero{padding:100px 0 70px}
.eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#00ffb4;margin-bottom:18px}
h1{font-size:clamp(42px,6.5vw,74px);font-weight:700;line-height:1.08;letter-spacing:-.02em}
.sub{margin-top:24px;font-size:18px;color:#a0a0b8;max-width:54ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:28px;padding-bottom:90px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;text-decoration:none;color:#fff;transition:.3s;display:block;backdrop-filter:blur(8px)}
.card:hover{transform:translateY(-6px);border-color:rgba(0,255,180,.5);box-shadow:0 24px 60px -20px rgba(0,255,180,.4)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.cbody{padding:22px 24px 26px}
.ctitle{font-size:22px;font-weight:600;margin-bottom:8px}
.csub{font-size:15px;color:#a0a0b8}
.tags{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tag{font-size:12px;color:#00ffb4;border:1px solid rgba(0,255,180,.35);padding:3px 11px;border-radius:20px}
footer{padding:36px 40px;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;font-size:13px;color:#808098;position:relative;z-index:1}
</style>
</head>
<body>
<nav class="nav"><div class="nav-in"><div class="brand">作品集</div><div class="links"><a href="#">作品</a><a href="#">关于</a><a href="#">联系</a></div></div></nav>
<div class="wrap hero"><div class="eyebrow">Selected Works</div><h1>界面设计与前端实现</h1><p class="sub">从真实需求出发，追求克制的视觉与扎实的交互。</p></div>
<div class="wrap"><div class="grid">
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">界面重构计划</div><div class="csub">企业级后台视觉与交互重构</div><div class="tags"><span class="tag">Vue</span><span class="tag">Design System</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">数据看板系统</div><div class="csub">面向运维的实时监控面板</div><div class="tags"><span class="tag">Spring Boot</span><span class="tag">ECharts</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">内容平台</div><div class="csub">创作者内容发布与展示</div><div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span></div></div></a>
</div></div>
<footer><span>© 2026 Portfolio</span><span>Aurora</span></footer>
<script src="/styles-preview/switcher.js"></script>
</body>
</html>
