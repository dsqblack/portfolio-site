<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S13 手绘涂鸦 Handdrawn</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--paper:#fdfbf5;--ink:#2b2b2b;--blue:#4a6fa5;--red:#e63946}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Patrick Hand',cursive;line-height:1.6;
background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(74,111,165,.12) 31px 32px);font-size:17px}
.nav{padding:26px 0}
.nav-in{max-width:1000px;margin:0 auto;padding:0 40px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Caveat',cursive;font-size:34px;font-weight:700;transform:rotate(-2deg);border-bottom:3px solid var(--red);padding-bottom:2px}
.links{display:flex;gap:30px;font-size:18px}
.links a{color:var(--blue);text-decoration:none;position:relative}
.links a:hover::after{content:'';position:absolute;left:-4px;right:-4px;bottom:-2px;height:8px;background:rgba(230,57,70,.3);border-radius:50%;transform:rotate(-1deg)}
.wrap{max-width:1000px;margin:0 auto;padding:0 40px}
.hero{padding:50px 0 40px}
.eyebrow{font-size:20px;color:var(--red);margin-bottom:10px;transform:rotate(-1deg);display:inline-block}
h1{font-family:'Caveat',cursive;font-size:clamp(46px,8vw,86px);font-weight:700;line-height:1;color:var(--ink)}
h1 span{color:var(--blue);border-bottom:4px wavy var(--red)}
.sub{margin-top:20px;font-size:20px;color:#555;max-width:50ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:36px;padding-bottom:90px}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:14px;text-decoration:none;color:var(--ink);transition:.2s;display:block;box-shadow:3px 4px 0 rgba(43,43,43,.2)}
.card:hover{transform:rotate(-1deg) translateY(-4px);box-shadow:5px 7px 0 rgba(43,43,43,.25)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:8px;border:1.5px solid var(--ink)}
.cbody{padding:14px 8px 8px}
.ctitle{font-family:'Caveat',cursive;font-size:30px;font-weight:700;line-height:1.1;margin-bottom:4px}
.csub{font-size:17px;color:#666}
.tags{margin-top:10px;font-size:15px;color:var(--red);transform:rotate(-1deg)}
.tag{display:inline-block;margin-right:10px;border-bottom:2px solid var(--red);padding-bottom:1px}
footer{padding:36px 40px;max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;font-size:16px;color:#888}
</style>
</head>
<body>
<div class="nav"><div class="nav-in"><div class="brand">我的作品集</div><div class="links"><a href="#">作品</a><a href="#">关于</a><a href="#">联系</a></div></div></div>
<div class="wrap hero"><div class="eyebrow">~ 我的小作品 ~</div><h1>界面设计<span>与</span>前端实现</h1><p class="sub">从真实需求出发，追求克制的视觉与扎实的交互。</p></div>
<div class="wrap"><div class="grid">
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">界面重构计划</div><div class="csub">企业级后台视觉与交互重构</div><div class="tags"><span class="tag">Vue</span><span class="tag">DS</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">数据看板系统</div><div class="csub">面向运维的实时监控面板</div><div class="tags"><span class="tag">Boot</span><span class="tag">ECharts</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">内容平台</div><div class="csub">创作者内容发布与展示</div><div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span></div></div></a>
</div></div>
<footer><span>© 2026 作品集</span><span>手绘风 ✎</span></footer>
<script src="/styles-preview/switcher.js"></script>
</body>
</html>
