<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S01 编辑风 Editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#14120f;--ink2:#55504a;--accent:#c8553d;--line:#e3ddd4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.6}
.nav{position:sticky;top:0;background:rgba(250,248,245,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:10}
.nav-in{max-width:1180px;margin:0 auto;padding:18px 40px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
.brand span{color:var(--accent)}
.links{display:flex;gap:32px;font-size:14px;color:var(--ink2)}
.links a{color:inherit;text-decoration:none}.links a:hover{color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}
.hero{padding:100px 0 72px}
.eyebrow{font-family:monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
h1{font-family:'Fraunces',serif;font-size:clamp(42px,7vw,80px);font-weight:600;line-height:1.05;letter-spacing:-.02em;max-width:14ch}
.sub{margin-top:24px;font-size:19px;color:var(--ink2);max-width:52ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:36px 32px;padding-bottom:100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:.2s;color:inherit;text-decoration:none;display:block}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -20px rgba(20,18,15,.22)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.cbody{padding:22px 24px 26px}
.ctitle{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin-bottom:8px}
.csub{font-size:14.5px;color:var(--ink2)}
.tags{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tag{font-family:monospace;font-size:11px;background:#f2eee8;border:1px solid var(--line);padding:3px 9px;border-radius:2px;color:var(--ink2)}
footer{border-top:1px solid var(--line);padding:36px 40px;max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;font-family:monospace;font-size:12px;color:#9a938a}
</style>
</head>
<body>
<nav class="nav"><div class="nav-in"><div class="brand">作品<span>集</span></div><div class="links"><a href="#">作品</a><a href="#">关于</a><a href="#">联系</a></div></div></nav>
<div class="wrap hero"><div class="eyebrow">Selected Works</div><h1>界面设计与前端实现</h1><p class="sub">这里是我参与设计与开发的作品，从真实需求出发，追求克制的视觉与扎实的交互。</p></div>
<div class="wrap"><div class="grid">
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">界面重构计划</div><div class="csub">一套企业级后台的视觉与交互重构</div><div class="tags"><span class="tag">Vue</span><span class="tag">Design System</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">数据看板系统</div><div class="csub">面向运维的实时监控面板</div><div class="tags"><span class="tag">Spring Boot</span><span class="tag">ECharts</span></div></div></a>
<a class="card" href="#"><img src="/img/1.jpg" alt=""><div class="cbody"><div class="ctitle">内容平台</div><div class="csub">创作者内容发布与展示</div><div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span></div></div></a>
</div></div>
<footer><span>© 2026 Portfolio</span><span>Built with Spring Boot</span></footer>
<script src="/styles-preview/switcher.js"></script>
</body>
</html>
