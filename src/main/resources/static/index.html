<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 — Portfolio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">作品<span>集</span></a>
    <div class="nav-links">
      <a href="/" class="active">作品</a>
      <a href="/about">关于</a>
      <a href="/contact">联系</a>
    </div>
  </div>
</nav>

<header class="hero wrap">
  <div class="hero-eyebrow">Selected Works</div>
  <h1 class="hero-title">界面设计<br>与前端实现</h1>
  <p class="hero-sub">这里是我参与设计与开发的作品。每一个项目都从真实需求出发，追求克制的视觉与扎实的交互。</p>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">暂无作品</div>
</main>

<footer class="footer">
  <span>© <span id="year"></span> Portfolio</span>
  <span>Built with Spring Boot</span>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function coverHtml(p){
  if (p.coverUrl) {
    return `<div class="card-cover"><img src="${escapeHtml(p.coverUrl)}" alt="${escapeHtml(p.title)}" loading="lazy"></div>`;
  }
  return `<div class="card-cover"><div class="card-cover-placeholder">${escapeHtml((p.title||'?').charAt(0))}</div></div>`;
}

function tagsHtml(stack){
  if (!stack) return '';
  const tags = stack.split(',').map(t => t.trim()).filter(Boolean);
  if (!tags.length) return '';
  return `<div class="card-tags">${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`;
}

fetch('/api/project/list')
  .then(r => r.json())
  .then(res => {
    const list = res.data || [];
    const grid = document.getElementById('grid');
    if (!list.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    grid.innerHTML = list.map(p => `
      <a class="card" href="/project/${p.id}">
        ${coverHtml(p)}
        <div class="card-body">
          <div class="card-title">${escapeHtml(p.title)}</div>
          <div class="card-sub">${escapeHtml(p.subtitle || '')}</div>
          ${tagsHtml(p.techStack)}
        </div>
      </a>
    `).join('');
  })
  .catch(() => {
    document.getElementById('empty').style.display = 'block';
  });
</script>
</body>
</html>
