server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/portfolio?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.portfolio.entity
  configuration:
    map-underscore-to-camel-case: true

# 管理后台登录口令（生产环境请通过环境变量 PORTFOLIO_ADMIN_TOKEN 覆盖）
portfolio:
  admin:
    token: ${PORTFOLIO_ADMIN_TOKEN:change-me-please}
